name: Game CI / Deploy (reusable)

# Reusable workflow that every sibling game in freegamestore-online/* calls
# from its own .github/workflows/deploy.yml.
#
# Why this exists:
#   - 43 games shouldn't each carry ~70 lines of identical yaml that drifts
#     out of sync.
#   - Pinning the compliance CLI / wrangler / node versions in ONE place
#     means a single PR here lifts the whole platform forward.
#   - The build/compliance/deploy pipeline is provably the same for every
#     game — no per-repo accidental divergence.
#
# Each game's caller file is ~15 lines:
#   on: { push: { branches: [main] }, pull_request: { branches: [main] } }
#   jobs:
#     ci-and-deploy:
#       uses: freegamestore-online/freegamestore/.github/workflows/game-ci.yml@main
#       with:
#         cf_project: freebowlingapp
#       permissions: { contents: read, deployments: write }
#       secrets: inherit
#
# Two-job design (compliance → deploy):
#   The compliance job runs untrusted code — `npx @freegamestore/cli`
#   ultimately resolves to whatever npm serves and runs in the runner. By
#   placing the deploy in a separate job with `needs: compliance`, the
#   Cloudflare deploy token NEVER co-exists in the same runner process
#   with the compliance CLI. A compromised CLI release can fail the
#   build, but cannot exfiltrate the CF token (it's only present in the
#   second job's environment) and cannot tamper with the artifact in a
#   way that survives the artifact upload/download round-trip without
#   detection. The compliance job has no secrets at all; the deploy job
#   has only what it strictly needs.

on:
  workflow_call:
    inputs:
      cf_project:
        description: "DEPRECATED — legacy CF Pages project name. Ignored since the Path B migration (2026-05-28); games deploy to R2, not CF Pages. Kept so existing caller files don't error."
        required: false
        type: string
      compliance_cli_version:
        description: "Pinned @freegamestore/cli version for the compliance gate. Bump deliberately."
        required: false
        type: string
        default: "0.2.1"
      node_version:
        description: "Node.js major version"
        required: false
        type: string
        default: "22"
      cloudflare_account_id:
        description: "Cloudflare account ID (same across the platform)"
        required: false
        type: string
        default: "c1089bfcc43c1c6c2aa89e584e86f0bc"
    secrets:
      # Path B (R2) deploy creds — org-level secrets on freegamestore-online.
      # CLOUDFLARE_API_TOKEN is no longer required (we don't `wrangler pages
      # deploy` anymore) but stays optional so callers passing it don't break.
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

jobs:
  # Build + compliance check. NO secrets in this job's env — if the
  # pinned CLI version is compromised, the worst it can do is fail
  # this job (blocking deploy) or upload a tampered artifact. Either
  # is recoverable.
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Platform compliance — runs every check the CLI ships (bundle size,
      # brand fonts, tracking SDKs, PWA manifest, store link, audio mute,
      # viewport, brand-token leaks). Pinned version so a CLI release can't
      # silently flip green deploys to red.
      - name: Platform compliance
        run: npx -y "@freegamestore/cli@${{ inputs.compliance_cli_version }}" check

      # Hand the built artifact off to the deploy job. `if-no-files-found:
      # error` means we'd rather hard-fail than silently deploy nothing.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  # Deploy job (Path B) — runs only on push-to-main. Downloads the artifact
  # built by the compliance job and syncs it to the fgs-games R2 bucket at
  # games/<repo>/. The freegamestore-host Worker (*.freegamestore.online/*)
  # serves from that prefix using a D1 routes row written at provision time
  # by freegamestore-admin. No per-game CF Pages project → no 100/account
  # cap on the free games side. The R2 creds live in this second job only,
  # never alongside the untrusted compliance CLI (same isolation rationale
  # as before, just R2 creds instead of a Pages token).
  deploy:
    needs: compliance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Deploy to R2 (Path B)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::R2_ACCESS_KEY_ID not set on freegamestore-online org secrets"; exit 1; }
          aws s3 sync web/dist "s3://fgs-games/games/${GITHUB_REPOSITORY##*/}/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --delete \
            --no-progress
          echo "Deployed games/${GITHUB_REPOSITORY##*/} from ${GITHUB_SHA::7} to R2 (Path B)"
