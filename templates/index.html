<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeGameStore — Free-Forever Web Games</title>
  <meta name="description" content="A platform of free-forever web games. No charges, no plans, no paywalls. Works on mobile, tablet, and desktop. Open source." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FreeGameStore — Free-Forever Web Games" />
  <meta property="og:description" content="A platform of free-forever web games. No charges, no plans, no paywalls. Works on mobile, tablet, and desktop. Open source." />
  <meta property="og:url" content="https://freegamestore.online/" />
  <meta property="og:image" content="https://freegamestore.online/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <a href="/" class="logo">Free<span>Game</span>Store</a>
      <nav>
        <a href="/" class="active">Games</a>
        <a href="https://freeappstore.online">Apps</a>
        <a href="/about.html">About</a>
        <a href="/contribute.html">Contribute</a>
        <a href="/guidelines.html">Guidelines</a>
        <a href="https://progamestore.online" class="pro-link">Pro</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="apps-section" id="games" style="padding-top: 2rem;">
      <div class="filter-bar">
        {{FILTER_BUTTONS}}
      </div>
      <div class="apps-grid">
        {{GAMES_GRID}}
      </div>
    </section>

    <aside style="text-align: center; padding: 1.5rem 0 0.5rem; font-size: 0.9rem; color: var(--muted);">
      Looking for apps? Visit <a href="https://freeappstore.online" style="color: var(--accent); font-weight: 600;">FreeAppStore</a> — free-forever web apps.
    </aside>
  </main>

  <footer>
    <div class="container">
      <div class="footer-left">
        <a href="/" class="logo">Free<span>Game</span>Store</a>
        <p>Free forever, open source, privacy-first.</p>
      </div>
      <div class="footer-links">
        <a href="/about.html">About</a>
        <a href="/contribute.html">Contribute</a>
        <a href="/guidelines.html">Guidelines</a>
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
        <a href="https://github.com/freegamestore-online">GitHub</a>
        <a href="https://progamestore.online" style="color:var(--pro);">Pro</a>
      </div>
    </div>
  </footer>

  <script>
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.app-card').forEach(card => {
          if (filter === 'all' || card.dataset.category === filter) {
            card.removeAttribute('hidden');
          } else {
            card.setAttribute('hidden', '');
          }
        });
      });
    });

    document.querySelectorAll('.app-card').forEach(card => {
      const aboutUrl = card.dataset.about;
      if (aboutUrl) {
        card.querySelector('.app-about').href = aboutUrl;
        card.style.cursor = 'pointer';
        card.addEventListener('click', e => {
          if (!e.target.closest('.app-btn-open')) {
            window.location.href = aboutUrl;
          }
        });
      }
    });
  </script>
</body>
</html>
